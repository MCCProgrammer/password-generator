<html>
    <head>
        <link rel="stylesheet" href="index.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    </head>
    <body>
        <div id="main-container">
            <div id="second-container">
                <div id="teste">
                    <h1 id="title">Generate a <span>random password</span></h1>
                    <button id="bdn-mode" onclick="changeMode()">Light Mode</button>
                </div>
                <h3>Never use an insecure password again.</h3>
                <button id="btn-gpass" onclick="generatePass()">Generate passwords</button>
            </div>
            <div id="third-container">
                <button class="btn-pass" id="firstpass-el" onclick="copyText()"></button>
                <button class="btn-pass" id="secondpass-el" onclick="copyText2()"></button>
            </div>
            <div id="lastcontainer">
                 <div class="slidecontainer">
                    <input type="range" min="10" max="40" value="20" class="slider" id="myRange">
                    <p>Value: <span id="demo"></span></p>
                 </div>
                 <div id="divcheck">
                    <input  id="checkSymbols" type="checkbox" name="checkSymbols" checked>
                    <label for="checkSymbols">Include Symbols</label>
                 </div>
            </div>
        </div>
        <script src="index.js"></script>
    </body>
</html>
